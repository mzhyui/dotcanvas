<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DotCanvas</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div class="brand"><img src="icon.svg" alt=""><strong>DotCanvas</strong><span id="path">local preview</span></div><div class="toolbar"><button id="add">＋ Card</button><button id="undo" aria-label="Undo" disabled>↶</button><button id="redo" aria-label="Redo" disabled>↷</button><span id="save-state" role="status">Ready</span></div></header>
