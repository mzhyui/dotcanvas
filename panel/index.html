<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DotCanvas</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div class="brand"><img src="icon.svg" alt=""><strong>DotCanvas</strong><span id="path">local preview</span></div><div class="toolbar"><button id="add">＋ Card</button><button id="connect">↗ Connect</button><button id="undo" disabled>↶</button><button id="redo" disabled>↷</button><span id="save-state">Ready</span></div></header>
<main><aside><input id="search" placeholder="Search cards…"><div id="inspector"><p class="muted">Select a card to edit it.</p></div></aside><section id="viewport"><svg id="edges"></svg><div id="world"></div><div id="empty" class="empty">Drag cards to shape your paper.<br><button id="empty-add">Add your first card</button></div></section></main><script src="app.js"></script></body></html>
